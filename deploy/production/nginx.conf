worker_processes 2;
worker_rlimit_nofile 65536;

pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format gateway_json escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$request_id",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time"}';

    access_log /dev/stdout gateway_json;
    server_tokens off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75s;
    keepalive_requests 1000;
    client_header_timeout 15s;
    client_body_timeout 300s;
    send_timeout 600s;
    reset_timedout_connection on;
    large_client_header_buffers 4 32k;

    client_body_temp_path /tmp/client_temp 1 2;
    proxy_temp_path /tmp/proxy_temp 1 2;
    fastcgi_temp_path /tmp/fastcgi_temp 1 2;
    uwsgi_temp_path /tmp/uwsgi_temp 1 2;
    scgi_temp_path /tmp/scgi_temp 1 2;

    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream mattermost_backend {
        zone mattermost_backend 64k;
        server iuin-server:8065 resolve max_fails=3 fail_timeout=10s;
    }

    # Reject unexpected Host headers while keeping a loopback-only liveness
    # endpoint for the container health check.
    server {
        listen 8065 default_server;
        server_name "";

        location = /_gateway/health {
            access_log off;
            allow 127.0.0.1;
            deny all;
            stub_status;
        }

        location / {
            return 444;
        }
    }

    server {
        listen 8065;
        server_name 10.22.111.16;

        if ($http_host != "10.22.111.16:8065") {
            return 444;
        }

        client_max_body_size 110m;

        proxy_http_version 1.1;
        proxy_set_header Host 10.22.111.16:8065;
        proxy_set_header X-Real-IP $remote_addr;
        # This is intentionally an overwrite, not $proxy_add_x_forwarded_for:
        # the gateway is the only public HTTP hop and clients must not be able
        # to inject the first address trusted by Mattermost.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host 10.22.111.16:8065;
        proxy_set_header X-Forwarded-Port 8065;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_hide_header X-Powered-By;

        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
        proxy_buffering off;

        location ~ ^/api/v[0-9]+/(users/)?websocket/?$ {
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
            proxy_pass http://mattermost_backend;
        }

        # Keep the upstream-signed Calls package intact while removing the product name
        # from the audio-device help text in the client bundle served to IUIN users.
        location ^~ /static/plugins/com.mattermost.calls/ {
            proxy_set_header Accept-Encoding "";
            sub_filter_types *;
            sub_filter_once off;
            sub_filter 'Set up audio devices to be used for Mattermost calls' 'Set up audio devices to be used for calls';
            sub_filter '设置用于 Mattermost 通话的音频设备' '设置用于通话的音频设备';
            proxy_pass http://mattermost_backend;
        }

        location ^~ /plugins/com.mattermost.calls/ {
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
            proxy_pass http://mattermost_backend;
        }

        location / {
            proxy_pass http://mattermost_backend;
        }
    }
}
